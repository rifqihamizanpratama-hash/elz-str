<!DOCTYPE html>
<html lang="id" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELZ STR</title>
<style>
:root{--bg:#050506;--card:#0c0c0f;--line:#34343c;--ink:#f2f5ff;--mut:#9a9aa6;--acc:#b8ff3d;--glow:#8dff00;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#1c1c22 0,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;padding-bottom:120px}



.avatar{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background-size:330%;background-position:66% 17%;background-color:#000;box-shadow:0 0 14px #2b5cff88;flex:none}
.sep{width:1px;height:42px;background:var(--line)}

main{max-width:560px;margin:0 auto;padding:0 16px}
.hero{aspect-ratio:2.3/1;border-radius:26px;border:2px solid var(--line);background-size:100% auto;background-position:top;background-color:#000;box-shadow:0 0 26px #1f4dff55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.card{padding:16px;border-radius:24px;border:2px solid var(--line);background:linear-gradient(160deg,#131316,var(--card));display:flex;flex-direction:column;cursor:pointer}
.card:last-child:nth-child(odd){grid-column:1/-1}
.ic img{width:100%;height:100%;object-fit:cover}
.ic{width:68px;height:68px;overflow:hidden;border-radius:18px;border:1.5px solid var(--line);background:#08080a;display:flex;align-items:center;justify-content:center;font-size:28px}
.card h3{margin:14px 0 2px;font:700 22px/1.2 inherit;font-family:inherit}
.card p{margin:0 0 14px;color:var(--mut);font-size:15px;line-height:1.35;flex:1}
.pill,.btn{display:block;width:100%;padding:13px;border:0;border-radius:999px;background:linear-gradient(#fff,#c9c9d1);color:#0a0a0a;font:700 15px inherit;font-family:inherit;letter-spacing:1px;text-align:center;text-decoration:none;cursor:pointer}
.btn{margin-top:12px;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.back{background:none;border:0;color:var(--acc);font:700 16px inherit;font-family:inherit;padding:6px 0;margin-bottom:6px;cursor:pointer}
.cat{margin:4px 0 12px;font:900 24px/1.2 "Arial Black",Impact,sans-serif}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;margin-bottom:8px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset,0 0 14px #b8ff3d33}
.opt span:last-child{font-weight:700;color:var(--acc);white-space:nowrap;margin-left:10px}
.panel{margin-top:14px;padding:16px;border-radius:20px;background:var(--card);border:1.5px solid var(--line)}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
input[type=text],input[type=tel],input[type=url],input[type=number]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#08080a;color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tot{display:flex;justify-content:space-between;margin:14px 0 4px;font-size:18px;font-weight:700}
.tot span:last-child{color:var(--acc)}
.hide{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.up{display:flex;align-items:center;justify-content:center;min-height:56px;padding:14px;border:2px dashed var(--acc);border-radius:14px;font-weight:700;text-align:center;cursor:pointer;background:#08080a}
.qr{display:flex;justify-content:center;margin:12px 0}
.qr img{max-width:440px;width:100%;border-radius:14px}
.sum{font-size:14px;color:var(--mut);line-height:1.7}
.sum b{color:var(--ink)}
.prev{max-width:100%;max-height:200px;margin-top:8px;border-radius:10px}
.err{color:#ff6b72;font-size:14px;margin-top:6px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;justify-content:space-between;padding:8px;border-radius:999px;border:1.5px solid var(--line);background:#0b0b0dee;backdrop-filter:blur(10px);z-index:5}
nav a,nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;border-radius:999px;background:none;color:var(--mut);font:700 12px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
nav i{font-style:normal;font-size:20px}
nav .on{background:#202026;color:#fff}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#202026;color:#fff;font-size:14px;z-index:6}

header{display:flex;align-items:center;gap:14px;padding:16px}
.av{width:60px;height:60px;border-radius:50%;border:2px solid #55555e;box-shadow:0 0 14px #ffffff2a;flex:none;background:#000}
.sep{width:1px;height:42px;background:var(--line)}
.brand{font:900 31px/1 "Arial Black",Impact,sans-serif;color:var(--acc);text-shadow:0 0 8px var(--glow),0 0 24px #8dff00aa;letter-spacing:1px;animation:gl 3s ease-in-out infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.hero2{padding:2.5px;border-radius:30px;background:conic-gradient(from var(--a),#2a2a30,#fff,#2a2a30 28%,var(--acc),#2a2a30 60%);animation:spin 7s linear infinite}
.hero2 .in{position:relative;display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:center;padding:16px;border-radius:28px;background:radial-gradient(90% 90% at 25% 30%,#1b1b20,#08080a)}
.logo{width:100%;aspect-ratio:1;border-radius:50%;display:block;box-shadow:0 0 26px #ffffff30}
.ht small{letter-spacing:3px;font-size:11px;color:var(--mut)}
.ht b{display:block;margin:4px 0 10px;font:italic 700 19px/1.2 Georgia,serif}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chips span{padding:6px 4px;border:1px solid var(--line);border-radius:999px;font-size:11.5px;text-align:center;background:#0d0d10;filter:grayscale(1) brightness(1.4)}
.strip{grid-column:1/-1;padding:9px;border:1.5px solid #cfcfd6;border-radius:999px;text-align:center;font-size:12px;letter-spacing:3px;font-weight:700}
.sp{position:absolute;color:#fff;font-size:15px;animation:tw 3s ease-in-out infinite}
.card{position:relative}
.card::after{content:"✦";position:absolute;top:14px;right:18px;color:#ffffffaa;font-size:14px;animation:tw 4s ease-in-out infinite}
.card:active{transform:scale(.98)}
nav i{position:relative;filter:grayscale(1) brightness(1.5)}
.dot{position:absolute;top:-2px;right:-7px;width:9px;height:9px;border-radius:50%;background:#35ff6a;box-shadow:0 0 8px #35ff6a;animation:tw 1.6s infinite}
@keyframes spin{to{--a:360deg}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes gl{0%,100%{text-shadow:0 0 6px var(--glow),0 0 16px #8dff0088}50%{text-shadow:0 0 10px var(--glow),0 0 34px #8dff00}}
.brand{font-family:"Rubik Glitch","Arial Black",Impact,sans-serif;font-weight:400;font-size:38px;position:relative}
.brand::before,.brand::after{content:attr(data-text);position:absolute;left:0;top:0;pointer-events:none;text-shadow:none;letter-spacing:1px}
.brand::before{color:#fff;clip-path:inset(0 0 52% 0);animation:g1 3.4s infinite steps(1)}
.brand::after{color:#35ff6a;clip-path:inset(52% 0 0 0);animation:g2 3.4s infinite steps(1)}
@keyframes g1{0%,88%,100%{transform:translate(0)}90%{transform:translate(-4px,1px)}94%{transform:translate(3px,-1px)}}
@keyframes g2{0%,88%,100%{transform:translate(0)}91%{transform:translate(4px,-1px)}95%{transform:translate(-3px,1px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ord{padding:14px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);margin-top:10px}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st.w{background:#3a3000;color:#ffd24d}.st.d{background:#10300f;color:#6dff8a}
.ord .btn{padding:10px;margin-top:8px}
input[type=password],select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#08080a;color:var(--ink);font:inherit}
.panel b{display:block;margin-bottom:6px}
.ar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ar button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.card.so{opacity:.6}.card.so .pill{background:#2a2a30;color:#ff6b72}
.card.so::before{content:"SOLD OUT";position:absolute;top:12px;left:12px;background:#ff3b45;color:#fff;font:900 11px Arial,sans-serif;padding:3px 8px;border-radius:6px;letter-spacing:1px;z-index:1}
.opt.so{opacity:.55}.opt.so span:last-child{color:#ff6b72}
.ffh{display:flex;align-items:center;gap:8px;margin:26px 0 12px}
.fft{font:italic 900 19px/1.1 "Arial Black",Impact,sans-serif}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1.5px solid #1f6b3a;border-radius:999px;color:#35ff6a;font:800 11px Arial,sans-serif;letter-spacing:2px}
.live i{width:8px;height:8px;border-radius:50%;background:#35ff6a;box-shadow:0 0 8px #35ff6a;animation:tw 1.6s infinite}
.ffa{width:auto;display:inline-block;padding:8px 12px;margin:0 0 0 auto;font-size:12px;letter-spacing:0}
.ffg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ac{position:relative;border:2px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#131316,#0a0a0c);display:flex;flex-direction:column}
.ac .im{aspect-ratio:4/3;background:#050506 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px}
.ac .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.ac .no{font:700 12px/1.3 "Courier New",monospace;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.ac .nt{font-size:12px;color:var(--mut);line-height:1.3}
.ac .pr{font:italic 900 24px/1.2 "Arial Black",Impact,sans-serif;margin:4px 0 8px}
.ac .pill{padding:12px;font-size:15px;margin-top:auto}
.ac.sold{border-style:dashed;border-color:#7a2630;opacity:.75}
.ac.sold .pill{background:#2a2a30;color:#ff6b72;cursor:not-allowed}
.ac.sold::before{content:"SOLD";position:absolute;top:14px;left:10px;z-index:2;background:#ff3b45;color:#fff;font:900 16px Arial,sans-serif;letter-spacing:4px;padding:5px 16px;border-radius:10px;transform:rotate(-8deg);box-shadow:0 4px 14px #0008}
.code{font:900 22px "Arial Black",Impact,sans-serif;color:var(--acc);letter-spacing:1px;margin:4px 0 8px;word-break:break-all}
.me{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--acc);color:#0a0a0a;font-size:11px;font-weight:700}
.ac .vid{margin:6px 0 2px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#0c0c10;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;align-self:flex-start}
.ac .vid[hidden]{display:none}
.dsc{background:#ff3b45;color:#fff;font:800 11px Arial,sans-serif;padding:2px 7px;border-radius:6px;font-style:normal}
.ac>.dsc{position:absolute;top:12px;right:10px}
.ffh[hidden]{display:none}
</style>
