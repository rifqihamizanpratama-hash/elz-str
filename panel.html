<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Panel</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#050506">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#050506;--card:#0c0c0f;--line:#34343c;--ink:#f2f2f7;--mut:#9a9aa6;--acc:#b8ff3d;--ok:#35ff6a;--warn:#ffd24d;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(120% 50% at 50% 0,#17171c 0,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0px) 0 calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
h1{font:900 24px/1.2 "Arial Black",Impact,sans-serif;margin:0 0 12px;text-align:center}
.lgo{width:110px;height:110px;border-radius:50%;display:block;margin:30px auto 10px;box-shadow:0 0 22px #ffffff30}
.panel{padding:16px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);margin-top:12px}
.panel>b{display:block;margin-bottom:6px}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
input,select,textarea{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:#08080a;color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:999px;background:linear-gradient(#fff,#c9c9d1);color:#0a0a0a;font:700 15px inherit;font-family:inherit;cursor:pointer;text-align:center}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.err{color:#ff6b72;font-size:14px;margin-top:6px}
.msg{font-size:14px;color:var(--mut);margin-top:8px}
.top{display:flex;align-items:center;gap:14px;padding:6px 0 14px}
.pp{width:60px;height:60px;border-radius:50%;border:2px solid #55555e;box-shadow:0 0 14px #ffffff2a;flex:none;background:#000}
.ttl{font:900 22px/1.1 "Arial Black",Impact,sans-serif}
.sub{font:700 12px "Courier New",monospace;letter-spacing:3px;color:var(--mut)}
.ico{margin-left:auto;width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stc{padding:16px 6px 12px;border-radius:22px;border:2px solid var(--line);background:linear-gradient(160deg,#131316,#0a0a0c);color:var(--mut);cursor:pointer;font:inherit;text-align:center}
.stc b{display:block;font:900 34px/1.1 "Arial Black",Impact,sans-serif;color:var(--acc)}
.stc b.y{color:var(--warn)}.stc b.g{color:var(--ok)}
.stc span{font:700 11px "Courier New",monospace;letter-spacing:3px}
.stc.on{border-color:#cfcfd6;box-shadow:0 0 16px #ffffff22}
.tabs{display:flex;gap:8px;margin:14px 0 8px}
.tabs button{flex:1;padding:11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:700 14px inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:#202026;color:#fff;border-color:#55555e}
.srch{position:relative}.srch input{padding-left:42px}.srch i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.7}
.o{padding:16px;border:2px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#101013,#0a0a0c);margin-top:12px}
.oh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oid{font:800 15px "Courier New",monospace;letter-spacing:1px;color:var(--acc);word-break:break-all}
.ot{font-size:13px;color:var(--mut)}
.stt{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.stt i{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px}
.stt.done{color:var(--ok)}.stt.done i{background:var(--acc);color:#0a0a0a}
.stt.wait{color:var(--warn)}.stt.wait i{background:#3a3000}
.oi{margin:10px 0 6px;font-size:16px;font-weight:600;word-break:break-word}.oi.dn{text-decoration:line-through;color:#d6d6de}
.ol{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:#8fb4ff;word-break:break-all}
.cp{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#0c0c10;color:var(--ink);cursor:pointer}
.pf{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#0a0a0d;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;width:100%;text-align:left}
.proof{max-width:100%;border-radius:14px;margin-top:8px}
.ab{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ab button{flex:1;min-width:110px;padding:11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.ab .ok{background:var(--acc);color:#0a0a0a;font-weight:700;border-color:var(--acc)}
.ar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ar button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.up{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px;border:2px dashed var(--acc);border-radius:14px;font-weight:700;text-align:center;cursor:pointer;background:#08080a;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="lg">
  <img class="lgo" src="/icon-192.png" alt="">
  <h1>Admin Panel</h1>
  <div class="panel">
    <label for="pw">Password admin</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="err" id="pe"></div>
    <button class="btn" id="plg">Masuk</button>
  </div>
</div>

<div class="wrap hide" id="app">
  <div class="top"><img class="pp" src="/icon-192.png" alt=""><div><div class="ttl">Admin Panel</div><div class="sub">PESANAN MASUK</div></div><button class="ico" id="out" aria-label="Keluar">⎋</button></div>
  <div class="stats" id="fl">
    <button class="stc on" data-f="all"><b id="sT">0</b><span>TOTAL</span></button>
    <button class="stc" data-f="menunggu"><b class="y" id="sB">0</b><span>BELUM</span></button>
    <button class="stc" data-f="selesai"><b class="g" id="sS">0</b><span>SELESAI</span></button>
  </div>
  <div class="tabs"><button id="t1" class="on">Pesanan</button><button id="t2">Produk &amp; akun</button></div>

  <section id="s1">
    <div class="srch"><i>🔍</i><input type="search" id="q" placeholder="Cari ID pesanan / nama..."></div>
    <div id="ol"></div>
    <div class="msg" id="om"></div>
    <button class="btn g" id="rf">Muat ulang</button>
  </section>

  <section id="s2" class="hide">
    <div class="panel"><b>Produk</b>
      <label for="ps">Pilih produk</label><select id="ps"></select>
      <div class="msg" id="pinfo"></div>
      <label class="up" for="cif" id="cil">Ganti gambar produk</label>
      <input type="file" id="cif" class="vh" accept="image/*">
      <label for="ed">Deskripsi singkat (di kartu)</label><input type="text" id="ed">
      <label for="edl">Deskripsi lengkap (di halaman produk)</label><textarea id="edl" rows="3"></textarea>
      <button class="btn g" id="eds">Simpan deskripsi</button>
      <button class="btn g" id="pso">Tandai SOLD OUT</button>
      <button class="btn g" id="pdel">Hapus produk ini</button>
    </div>
    <div class="panel"><b>Paket / akun</b>
      <div id="pk"></div>
      <label>Tambah paket / akun</label>
      <input type="text" id="kl" placeholder="Nama paket / akun">
      <input type="number" id="kp" inputmode="numeric" placeholder="Harga (angka)" style="margin-top:6px">
      <input type="text" id="kn" placeholder="Catatan / keterangan (opsional)" style="margin-top:6px">
      <label class="up" for="pif" id="pil">Gambar paket/akun (opsional)</label>
      <input type="file" id="pif" class="vh" accept="image/*">
      <button class="btn" id="kadd">Tambah</button>
    </div>
    <div class="panel"><b>Produk baru</b>
      <input type="text" id="np" placeholder="Nama produk">
      <input type="text" id="ni" placeholder="Emoji ikon (mis. 🔥)" style="margin-top:6px">
      <input type="text" id="nd" placeholder="Deskripsi singkat" style="margin-top:6px">
      <textarea id="ndl" rows="3" placeholder="Deskripsi lengkap (opsional)" style="margin-top:6px"></textarea>
      <label class="up" for="nif" id="nil">Ketuk untuk pilih gambar produk</label>
      <input type="file" id="nif" class="vh" accept="image/*">
      <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="nso" style="width:auto"> Tandai SOLD OUT</label>
      <button class="btn" id="nadd">Tambah produk</button>
    </div>
    <button class="btn" id="save">Simpan semua perubahan</button>
    <div class="msg" id="smsg"></div>
  </section>
</div>

<script>
var $=function(i){return document.getElementById(i)},rp=function(n){return "Rp "+n.toLocaleString("id-ID")};
var PW="",ORD=[],FL="all",DATA=null;
try{PW=localStorage.getItem("elz_pw")||""}catch(e){}
function mk(t,x,c){var e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e}
function api(p,o){o=o||{};o.headers=Object.assign({"x-admin-pw":PW,"Content-Type":"application/json"},o.headers||{});o.cache="no-store";return fetch(p,o)}
function wa(n){n=String(n).replace(/\D/g,"");if(n.charAt(0)==="0")n="62"+n.slice(1);else if(n.charAt(0)==="8")n="62"+n;return n}
function fmt(t){return new Date(t).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}

async function enter(){
  try{var r=await api("/api/orders");
    if(r.status===401){PW="";try{localStorage.removeItem("elz_pw")}catch(e){}$("lg").classList.remove("hide");$("app").classList.add("hide");return false}
    if(!r.ok)throw 0;var j=await r.json();ORD=j.orders||[];
    $("lg").classList.add("hide");$("app").classList.remove("hide");drawO();return true}
  catch(e){$("pe").textContent="Server belum siap. Cek database di Vercel.";return false}}
$("plg").onclick=async function(){PW=$("pw").value;$("pe").textContent="";
  var ok=await enter();
  if(ok){try{localStorage.setItem("elz_pw",PW)}catch(e){}$("pw").value=""}
  else if(!$("pe").textContent)$("pe").textContent="Password salah."};
$("out").onclick=function(){PW="";try{localStorage.removeItem("elz_pw")}catch(e){}$("app").classList.add("hide");$("lg").classList.remove("hide")};
if(PW)enter();

function tab(n){$("s1").classList.toggle("hide",n!==1);$("s2").classList.toggle("hide",n!==2);$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);if(n===2)loadProd()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
[].forEach.call($("fl").children,function(b){b.onclick=function(){FL=b.getAttribute("data-f");[].forEach.call($("fl").children,function(x){x.classList.toggle("on",x===b)});tab(1);drawO()}});
$("q").oninput=drawO;
async function load(){try{var r=await api("/api/orders");if(r.ok){ORD=(await r.json()).orders||[];drawO()}}catch(e){}}
$("rf").onclick=load;setInterval(function(){if(!$("app").classList.contains("hide")&&!$("s1").classList.contains("hide"))load()},30000);

function oid(o){return "ORD-"+o.id.toUpperCase()}
function drawO(){var l=$("ol");l.innerHTML="";
  var done=ORD.filter(function(o){return o.status==="selesai"}).length,pend=ORD.length-done;
  $("sT").textContent=ORD.length;$("sB").textContent=pend;$("sS").textContent=done;
  document.title=(pend?"("+pend+") ":"")+"Admin Panel";
  var q=$("q").value.trim().toLowerCase();
  var list=ORD.filter(function(o){if(FL!=="all"&&(FL==="selesai")!==(o.status==="selesai"))return false;
    return !q||(oid(o)+" "+o.nm+" "+o.prod+" "+o.pkg).toLowerCase().indexOf(q)>-1});
  $("om").textContent=list.length?"":"Tidak ada pesanan.";
  list.forEach(function(o){var d=o.status==="selesai",c=mk("div",null,"o"),h=mk("div",null,"oh"),lf=mk("div");
    lf.appendChild(mk("div",oid(o),"oid"));lf.appendChild(mk("div","🕘 "+fmt(o.ts),"ot"));h.appendChild(lf);
    var st=mk("div",null,"stt "+(d?"done":"wait"));st.appendChild(mk("i",d?"✔":"⏳"));st.appendChild(mk("span",d?"Done":"Belum"));h.appendChild(st);c.appendChild(h);
    c.appendChild(mk("div",o.prod+" • "+o.pkg+(o.note?" ("+o.note+")":"")+" • x"+o.q+" • "+rp(o.total),"oi"+(d?" dn":"")));
    var ln=mk("div",null,"ol"),sp=mk("span","👤 "+o.nm+"  •  ");var a=mk("a",o.wa);a.href="https://wa.me/"+wa(o.wa);a.target="_blank";a.rel="noopener";a.style.color="#8fb4ff";sp.appendChild(a);
    var cp=mk("button","⧉","cp");cp.setAttribute("aria-label","Salin nomor");cp.onclick=function(){try{navigator.clipboard.writeText(o.wa);cp.textContent="✓"}catch(e){}setTimeout(function(){cp.textContent="⧉"},1200)};
    ln.appendChild(sp);ln.appendChild(cp);c.appendChild(ln);
    var pb=mk("div");
    if(o.proof){var bp=mk("button","🖼  Lihat bukti TF","pf");bp.onclick=async function(){bp.disabled=true;try{var r=await api("/api/orders?proof="+encodeURIComponent(o.id));var j=await r.json();pb.innerHTML="";if(j.proof){var im=mk("img",null,"proof");im.src=j.proof;pb.appendChild(im)}else pb.appendChild(mk("div","Bukti sudah kedaluwarsa.","msg"))}catch(e){}bp.disabled=false};c.appendChild(bp)}
    c.appendChild(pb);
    var ab=mk("div",null,"ab");
    var bs=mk("button",d?"Batalkan selesai":"Konfirmasi selesai",d?"":"ok");
    bs.onclick=async function(){bs.disabled=true;try{await api("/api/orders",{method:"PUT",body:JSON.stringify({id:o.id,status:d?"menunggu":"selesai"})})}catch(e){}load()};
    var bd=mk("button","Hapus");bd.onclick=async function(){if(bd.textContent!=="Tekan lagi"){bd.textContent="Tekan lagi";return}
      try{await api("/api/orders",{method:"DELETE",body:JSON.stringify({id:o.id})})}catch(e){}load()};
    ab.appendChild(bs);ab.appendChild(bd);c.appendChild(ab);l.appendChild(c)})}

var FFK="AKUN FF",NIMG="",PIMG="";
function prep(f,max,sq,q){return new Promise(function(ok,no){var r=new FileReader();r.onerror=no;r.onload=function(){var im=new Image();im.onerror=no;im.onload=function(){
  var c=document.createElement("canvas"),x=c.getContext("2d");
  if(sq){var s=Math.min(im.width,im.height);c.width=c.height=max;x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max)}
  else{var k=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.drawImage(im,0,0,c.width,c.height)}
  ok(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(f)})}
async function loadProd(){
  if(!DATA){try{var r=await fetch("/api/data",{cache:"no-store"});if(r.status===200)DATA=(await r.json()).DATA}catch(e){}
    if(!DATA){try{DATA=await (await fetch("/defaults.json")).json()}catch(e){DATA={}}}}
  drawP()}
function dirty(){var kb=Math.round(JSON.stringify(DATA).length/1024);$("smsg").textContent="Ada perubahan yang belum disimpan. Ukuran data: "+kb+" KB (maks 900 KB)."}
function drawP(){var s=$("ps"),cur=s.value;s.innerHTML="";Object.keys(DATA).forEach(function(k){var o=mk("option",k);o.value=k;s.appendChild(o)});if(cur&&DATA[cur])s.value=cur;drawK();fillD()}
function fillD(){var k=$("ps").value;$("ed").value=(DATA[k]&&DATA[k].d)||"";$("edl").value=(DATA[k]&&DATA[k].dl)||""}
function drawK(){var k=$("ps").value,b=$("pk");b.innerHTML="";$("pdel").textContent="Hapus produk ini";if(!DATA[k])return;
  $("pso").textContent=DATA[k].so?"Hapus tanda SOLD OUT":"Tandai SOLD OUT";$("pinfo").textContent=DATA[k].so?"Status: SOLD OUT":"";
  if(!DATA[k].p.length)b.appendChild(mk("div","Belum ada paket / akun.","msg"));
  DATA[k].p.forEach(function(it,i){var sp=DATA[k].sp||[],sold=sp.indexOf(it[0])>-1,r=mk("div",null,"ar");
    r.appendChild(mk("span",(sold?"⛔ ":"")+(it[3]?"🖼 ":"")+it[0]+" — "+rp(it[1])+(it[2]?" ("+it[2]+")":"")));
    var bb=mk("div");bb.style.cssText="display:flex;gap:6px";
    var t=mk("button",sold?"Buka":"Habis");t.onclick=function(){var a=DATA[k].sp||[],j=a.indexOf(it[0]);if(j>-1)a.splice(j,1);else a.push(it[0]);DATA[k].sp=a;dirty();drawK()};
    var x=mk("button","Hapus");x.onclick=function(){DATA[k].p.splice(i,1);dirty();drawK()};
    bb.appendChild(t);bb.appendChild(x);r.appendChild(bb);b.appendChild(r)})}
$("ps").onchange=function(){drawK();fillD()};
$("cif").onchange=async function(){var f=this.files[0],k=$("ps").value;if(!f||!DATA[k])return;try{DATA[k].img=await prep(f,160,true,0.82);dirty();$("cil").textContent="Gambar diganti. Jangan lupa Simpan"}catch(e){$("smsg").textContent="Gambar gagal dibaca."}};
$("pif").onchange=async function(){var f=this.files[0];if(!f)return;try{PIMG=await prep(f,560,false,0.72);$("pil").textContent="Gambar dipilih (ketuk untuk ganti)"}catch(e){$("smsg").textContent="Gambar gagal dibaca."}};
$("nif").onchange=async function(){var f=this.files[0];if(!f)return;try{NIMG=await prep(f,160,true,0.82);$("nil").textContent="Gambar dipilih (ketuk untuk ganti)"}catch(e){$("smsg").textContent="Gambar gagal dibaca."}};
$("eds").onclick=function(){var k=$("ps").value;if(!DATA[k])return;DATA[k].d=$("ed").value.trim();var l=$("edl").value.trim();if(l)DATA[k].dl=l;else delete DATA[k].dl;dirty()};
$("pso").onclick=function(){var k=$("ps").value;if(!DATA[k])return;if(DATA[k].so)delete DATA[k].so;else DATA[k].so=true;dirty();drawK()};
$("kadd").onclick=function(){var k=$("ps").value,l=$("kl").value.trim(),p=parseInt($("kp").value,10),n=$("kn").value.trim();
  if(!DATA[k]||!l||!(p>=0)){$("smsg").textContent="Isi nama dan harga.";return}
  var it=PIMG?[l,p,n,PIMG]:(n?[l,p,n]:[l,p]);if(k===FFK)DATA[k].p.unshift(it);else DATA[k].p.push(it);
  PIMG="";$("pil").textContent="Gambar paket/akun (opsional)";$("kl").value="";$("kp").value="";$("kn").value="";dirty();drawK()};
$("pdel").onclick=function(){var k=$("ps").value;if(!DATA[k])return;if($("pdel").textContent!=="Tekan lagi untuk hapus"){$("pdel").textContent="Tekan lagi untuk hapus";return}delete DATA[k];dirty();drawP()};
$("nadd").onclick=function(){var n=$("np").value.trim();if(!n||DATA[n]){$("smsg").textContent=n?"Produk sudah ada.":"Isi nama produk.";return}
  var o={ic:$("ni").value.trim()||"🛒",d:$("nd").value.trim(),p:[]};if(NIMG)o.img=NIMG;if($("ndl").value.trim())o.dl=$("ndl").value.trim();if($("nso").checked)o.so=true;
  DATA[n]=o;NIMG="";$("nil").textContent="Ketuk untuk pilih gambar produk";$("np").value="";$("ni").value="";$("nd").value="";$("ndl").value="";$("nso").checked=false;dirty();drawP();$("ps").value=n;drawK();fillD()};
$("save").onclick=async function(){var m=$("smsg");m.textContent="Menyimpan...";
  try{var r=await api("/api/data",{method:"POST",body:JSON.stringify({DATA:DATA})});
    if(r.status===401){m.textContent="Password salah. Keluar lalu masuk lagi.";return}
    if(r.status===413){m.textContent="Data terlalu besar. Hapus beberapa foto atau akun lama.";return}
    if(!r.ok)throw 0;m.textContent="Tersimpan! Sudah tampil di web."}catch(e){m.textContent="Gagal menyimpan."}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});
</script>
</body>
</html>
