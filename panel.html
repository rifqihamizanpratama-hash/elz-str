<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel ELZ STR</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#050506">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#050506;--card:#0c0c0f;--line:#34343c;--ink:#f2f2f7;--mut:#9a9aa6;--acc:#b8ff3d;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0px) 0 calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.hide{display:none!important}
.lgo{width:110px;height:110px;border-radius:50%;display:block;margin:30px auto 10px;box-shadow:0 0 22px #ffffff30}
h1{font:900 24px/1.2 "Arial Black",Impact,sans-serif;margin:0 0 12px;text-align:center}
.panel{padding:16px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);margin-top:12px}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
input,select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#08080a;color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:999px;background:linear-gradient(#fff,#c9c9d1);color:#0a0a0a;font:700 15px inherit;font-family:inherit;cursor:pointer;text-align:center}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.err{color:#ff6b72;font-size:14px;margin-top:6px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
.bar b{font:900 20px "Arial Black",Impact,sans-serif;color:var(--acc)}
.sm{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{flex:1;padding:11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:700 14px inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:#202026;color:#fff;border-color:#55555e}
.chips{display:flex;gap:6px;margin:6px 0}
.chips button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--acc);color:#0a0a0a;font-weight:700;border-color:var(--acc)}
.o{padding:14px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);margin-top:10px}
.oh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.oh b{font:900 17px "Arial Black",Impact,sans-serif;letter-spacing:1px}
.st{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st.w{background:#3a3000;color:#ffd24d}.st.d{background:#10300f;color:#6dff8a}
.r{font-size:14px;color:var(--mut);word-break:break-word}.r b{color:var(--ink)}
.r a{color:var(--acc)}
.ab{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ab button{flex:1;min-width:90px;padding:10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.ab .ok{background:var(--acc);color:#0a0a0a;font-weight:700;border-color:var(--acc)}
.proof{max-width:100%;border-radius:12px;margin-top:8px}
.ar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ar button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.msg{font-size:14px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="lg">
  <img class="lgo" src="/icon-192.png" alt="">
  <h1>Panel ELZ STR</h1>
  <div class="panel">
    <label for="pw">Password admin</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="err" id="pe"></div>
    <button class="btn" id="plg">Masuk</button>
  </div>
</div>

<div class="wrap hide" id="app">
  <div class="bar"><b>PANEL ELZ STR</b><button class="sm" id="out">Keluar</button></div>
  <div class="tabs"><button id="t1" class="on">Pesanan <span id="cnt"></span></button><button id="t2">Produk</button></div>

  <section id="s1">
    <div class="chips" id="fl"><button data-f="menunggu" class="on">Menunggu</button><button data-f="selesai">Selesai</button><button data-f="all">Semua</button></div>
    <div id="ol"></div>
    <div class="msg" id="om"></div>
    <button class="btn g" id="rf">Muat ulang</button>
  </section>

  <section id="s2" class="hide">
    <div class="panel"><b>Produk & paket</b>
      <label for="ps">Pilih produk</label><select id="ps"></select>
      <div id="pk"></div>
      <label>Tambah paket</label>
      <input type="text" id="kl" placeholder="Nama paket (mis. 1 bulan)">
      <input type="number" id="kp" inputmode="numeric" placeholder="Harga (angka)" style="margin-top:6px">
      <input type="text" id="kn" placeholder="Catatan (opsional)" style="margin-top:6px">
      <button class="btn" id="kadd">Tambah paket</button>
      <button class="btn g" id="pdel">Hapus produk ini</button>
    </div>
    <div class="panel"><b>Produk baru</b>
      <input type="text" id="np" placeholder="Nama produk">
      <input type="text" id="ni" placeholder="Emoji ikon (mis. 🔥)" style="margin-top:6px">
      <input type="text" id="nd" placeholder="Deskripsi singkat" style="margin-top:6px">
      <button class="btn" id="nadd">Tambah produk</button>
    </div>
    <button class="btn" id="save">Simpan produk</button>
    <div class="msg" id="smsg"></div>
  </section>
</div>

<script>
var $=function(i){return document.getElementById(i)},rp=function(n){return "Rp "+n.toLocaleString("id-ID")};
var PW="",ORD=[],FL="menunggu",DATA=null;
try{PW=localStorage.getItem("elz_pw")||""}catch(e){}
function mk(t,x,c){var e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e}
function api(p,o){o=o||{};o.headers=Object.assign({"x-admin-pw":PW,"Content-Type":"application/json"},o.headers||{});o.cache="no-store";return fetch(p,o)}
function wa(n){n=String(n).replace(/\D/g,"");if(n.charAt(0)==="0")n="62"+n.slice(1);else if(n.charAt(0)==="8")n="62"+n;return n}
function fmt(t){return new Date(t).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}

async function enter(){
  try{var r=await api("/api/orders");
    if(r.status===401){PW="";try{localStorage.removeItem("elz_pw")}catch(e){}$("lg").classList.remove("hide");$("app").classList.add("hide");return false}
    if(!r.ok)throw 0;var j=await r.json();ORD=j.orders||[];
    $("lg").classList.add("hide");$("app").classList.remove("hide");drawO();return true}
  catch(e){$("pe").textContent="Server belum siap. Cek database di Vercel.";return false}}
$("plg").onclick=async function(){PW=$("pw").value;$("pe").textContent="";
  var ok=await enter();
  if(ok){try{localStorage.setItem("elz_pw",PW)}catch(e){}$("pw").value=""}
  else if(!$("pe").textContent)$("pe").textContent="Password salah."};
$("out").onclick=function(){PW="";try{localStorage.removeItem("elz_pw")}catch(e){}$("app").classList.add("hide");$("lg").classList.remove("hide")};
if(PW)enter();

function tab(n){$("s1").classList.toggle("hide",n!==1);$("s2").classList.toggle("hide",n!==2);$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);if(n===2)loadProd()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
[].forEach.call($("fl").children,function(b){b.onclick=function(){FL=b.getAttribute("data-f");[].forEach.call($("fl").children,function(x){x.classList.toggle("on",x===b)});drawO()}});
async function load(){try{var r=await api("/api/orders");if(r.ok){ORD=(await r.json()).orders||[];drawO()}}catch(e){}}
$("rf").onclick=load;setInterval(function(){if(!$("app").classList.contains("hide")&&!$("s1").classList.contains("hide"))load()},30000);

function row(l,v,link){var d=mk("div",null,"r");d.appendChild(mk("b",l+": "));
  if(link&&/^https?:\/\//i.test(v)){var a=mk("a",v);a.href=v;a.target="_blank";a.rel="noopener";d.appendChild(a)}else d.appendChild(document.createTextNode(v));return d}
function drawO(){var l=$("ol");l.innerHTML="";
  var pend=ORD.filter(function(o){return o.status!=="selesai"}).length;
  $("cnt").textContent=pend?"("+pend+")":"";document.title=(pend?"("+pend+") ":"")+"Panel ELZ STR";
  var list=ORD.filter(function(o){return FL==="all"||(FL==="selesai")===(o.status==="selesai")});
  $("om").textContent=list.length?"":"Tidak ada pesanan.";
  list.forEach(function(o){var d=o.status==="selesai",c=mk("div",null,"o"),h=mk("div",null,"oh");
    h.appendChild(mk("b","#"+o.id.slice(-6).toUpperCase()));h.appendChild(mk("span",d?"Selesai":"Menunggu","st "+(d?"d":"w")));c.appendChild(h);
    c.appendChild(row("Waktu",fmt(o.ts)));c.appendChild(row("Nama",o.nm));
    var w=row("WA","");var a=mk("a",o.wa);a.href="https://wa.me/"+wa(o.wa);a.target="_blank";a.rel="noopener";w.appendChild(a);c.appendChild(w);
    c.appendChild(row("Produk",o.prod+" – "+o.pkg+(o.note?" ("+o.note+")":"")));
    c.appendChild(row("Jumlah","x"+o.q));c.appendChild(row("Total",rp(o.total)));c.appendChild(row("Link",o.lk,true));
    var pb=mk("div");c.appendChild(pb);
    var ab=mk("div",null,"ab");
    if(o.proof){var bp=mk("button","Lihat bukti bayar");bp.onclick=async function(){bp.disabled=true;try{var r=await api("/api/orders?proof="+encodeURIComponent(o.id));var j=await r.json();pb.innerHTML="";if(j.proof){var im=mk("img",null,"proof");im.src=j.proof;pb.appendChild(im)}else pb.appendChild(mk("div","Bukti sudah kedaluwarsa.","msg"))}catch(e){}bp.disabled=false};ab.appendChild(bp)}
    var bs=mk("button",d?"Batalkan selesai":"Konfirmasi selesai",d?"":"ok");
    bs.onclick=async function(){bs.disabled=true;try{await api("/api/orders",{method:"PUT",body:JSON.stringify({id:o.id,status:d?"menunggu":"selesai"})})}catch(e){}load()};
    var bd=mk("button","Hapus");bd.onclick=async function(){if(bd.textContent!=="Tekan lagi"){bd.textContent="Tekan lagi";return}
      try{await api("/api/orders",{method:"DELETE",body:JSON.stringify({id:o.id})})}catch(e){}load()};
    ab.appendChild(bs);ab.appendChild(bd);c.appendChild(ab);l.appendChild(c)})}

async function loadProd(){
  if(!DATA){try{var r=await fetch("/api/data",{cache:"no-store"});if(r.status===200)DATA=(await r.json()).DATA}catch(e){}
    if(!DATA){try{DATA=await (await fetch("/defaults.json")).json()}catch(e){DATA={}}}}
  drawP()}
function drawP(){var s=$("ps"),cur=s.value;s.innerHTML="";Object.keys(DATA).forEach(function(k){var o=mk("option",k);o.value=k;s.appendChild(o)});if(cur&&DATA[cur])s.value=cur;drawK()}
function dirty(){$("smsg").textContent="Ada perubahan yang belum disimpan."}
function drawK(){var k=$("ps").value,b=$("pk");b.innerHTML="";$("pdel").textContent="Hapus produk ini";if(!DATA[k])return;
  DATA[k].p.forEach(function(it,i){var r=mk("div",null,"ar");r.appendChild(mk("span",it[0]+" — "+rp(it[1])+(it[2]?" ("+it[2]+")":"")));
    var x=mk("button","Hapus");x.onclick=function(){DATA[k].p.splice(i,1);dirty();drawK()};r.appendChild(x);b.appendChild(r)})}
$("ps").onchange=drawK;
$("kadd").onclick=function(){var k=$("ps").value,l=$("kl").value.trim(),p=parseInt($("kp").value,10),n=$("kn").value.trim();
  if(!DATA[k]||!l||!(p>=0))return;DATA[k].p.push(n?[l,p,n]:[l,p]);$("kl").value="";$("kp").value="";$("kn").value="";dirty();drawK()};
$("pdel").onclick=function(){var k=$("ps").value;if(!DATA[k])return;if($("pdel").textContent!=="Tekan lagi untuk hapus"){$("pdel").textContent="Tekan lagi untuk hapus";return}delete DATA[k];dirty();drawP()};
$("nadd").onclick=function(){var n=$("np").value.trim();if(!n||DATA[n])return;DATA[n]={ic:$("ni").value.trim()||"🛒",d:$("nd").value.trim(),p:[]};$("np").value="";$("ni").value="";$("nd").value="";dirty();drawP();$("ps").value=n;drawK()};
$("save").onclick=async function(){var m=$("smsg");m.textContent="Menyimpan...";
  try{var r=await api("/api/data",{method:"POST",body:JSON.stringify({DATA:DATA})});
    if(r.status===401){m.textContent="Password salah. Keluar lalu masuk lagi.";return}
    if(!r.ok)throw 0;m.textContent="Tersimpan! Sudah tampil di web."}catch(e){m.textContent="Gagal menyimpan."}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});
</script>
</body>
</html>
